name: Deploy Astro SSR to VPS

on:
  push:
    branches: [ "main" ] # Adapte si c'est "master"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH Agent & Add key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to VPS via SSH
        run: |
          ssh -o StrictHostKeyChecking=no \({{ secrets.SSH_USER }}@\){​secrets.SSH_HOST} << 'EOF'
            cd ~/clients.astrojs
            git pull
            bun install
            bun run build
            sudo systemctl restart clients-astro
          EOF